<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_top">
    <title>Join Combo Class now!</title>
    <link rel="stylesheet" href="../style/reg-form.css">
</head>

<body>

    <div class="main-wrapper">

        <div class="class-image">
            <img src="../photo/combo/excel+python.png">
        </div>


        <div class="container">

            <h2>Register Now!</h2>

            <div class="row">
                <label>Name</label>
                <input id="name" placeholder="Muhammad Ali bin Abu" required>
            </div>

            <div class="row">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="0132461004" required>
            </div>

            <div class="row">
                <label>Email</label>
                <input type="email" id="email" placeholder="training@gmail.com" required>
            </div>

            <div class="row" id="kelasRow1">
                <label for="kelas1">Please choose date for Excel</label>
                <input type="text" id="kelas1" name="kelas1"
                    class="kelas-input"
                    placeholder="Select a Friday or Saturday below"
                    readonly required>
                <span class="kelas-chevron"></span>

                <div class="calendar-wrapper" id="calendarWrapper1">
                    <div class="calendar-header">
                        <button type="button" id="prevMonth1" aria-label="Previous month">&lsaquo;</button>
                        <span id="calendarMonthLabel1"></span>
                        <button type="button" id="nextMonth1" aria-label="Next month">&rsaquo;</button>
                    </div>
                    <div class="calendar-weekdays">
                        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                    </div>
                    <div class="calendar-grid" id="calendarGrid1"></div>
                </div>
            </div>

            <div class="row" id="kelasRow2">
                <label for="kelas2">Please choose date for Python</label>
                <input type="text" id="kelas2" name="kelas2"
                    class="kelas-input"
                    placeholder="Select a Friday or Saturday below"
                    readonly required>
                <span class="kelas-chevron"></span>

                <div class="calendar-wrapper" id="calendarWrapper2">
                    <div class="calendar-header">
                        <button type="button" id="prevMonth2" aria-label="Previous month">&lsaquo;</button>
                        <span id="calendarMonthLabel2"></span>
                        <button type="button" id="nextMonth2" aria-label="Next month">&rsaquo;</button>
                    </div>
                    <div class="calendar-weekdays">
                        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                    </div>
                    <div class="calendar-grid" id="calendarGrid2"></div>
                </div>
            </div>

            <button id="joinBtn" onclick="join()">Join Us</button>

        </div>

    </div>

        <div class="popup" id="popup">
        <div class="popup-content">
          <h3>
            Thank you for joining SSZ Training! 🎉
          </h3>
          <img src="../photo/qr-bank.jpg">
          <h3>
             Payment method: QR DuitNow <br>
            Total Payable: RM75
          </h3>
          <p>
            <i>
                Once payment is confirmed, you received a invitation link to your class through your email!
                This would take up to 24 hours.
            </i>
          </p>
          <button id="popup" onclick="closePopup()">
          Close
          </button>
        </div>
      </div>

    <script src="../script/combo-script/excel-python-combo.js"></script>
</body>
</html>
