<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Function Training — SSZ Training and Consultancy</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #000000;
      --white: #ffffff;
      --blue: rgba(26, 77, 128, 0.55);
      --red: #b20000;
      --pink: #ff95b6;

      --border: rgba(0, 0, 0, 0.1);

      --font-display: "Space Grotesk", "Segoe UI", sans-serif;
      --font-body: "Inter", "Segoe UI", sans-serif;
      --font-mono: "IBM Plex Mono", "Consolas", monospace;

      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 8px;

      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 24px 50px rgba(0, 0, 0, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--white);
      color: var(--black);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* ---------- simple hero, matching exercise.html ---------- */
    .practice-hero {
      background: var(--black);
      padding: 90px 20px 40px;
      text-align: center;
    }

    .practice-hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 18px;
    }

    .practice-hero h1 {
      margin: 0 auto 16px;
      max-width: 720px;
      font-weight: 700;
      font-size: clamp(2rem, 4.5vw, 3rem);
      line-height: 1.2;
      color: var(--white);
    }

    .practice-hero p.subtitle {
      margin: 0 auto 34px;
      max-width: 560px;
      font-size: 0.95rem;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.65);
    }

    /* ---------- formula bar showcase ---------- */
    .formula-bar {
      display: flex;
      align-items: stretch;
      background: var(--white);
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      max-width: 640px;
      margin: 0 auto;
      border-left: 4px solid var(--red);
    }

    .formula-bar .name-box {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      min-width: 52px;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 13px;
      color: var(--black);
      background: rgba(255, 149, 182, 0.18);
      border-right: 1px solid var(--border);
    }

    .formula-bar .fx {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 14px;
      color: rgba(0, 0, 0, 0.5);
      padding: 0 14px;
      border-right: 1px solid var(--border);
      background: var(--white);
    }

    .formula-bar .fx-text {
      flex: 1;
      display: flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 13.5px;
      padding: 13px 18px;
      color: var(--black);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--white);
    }

    /* ---------- tab bar ---------- */
    nav.tabbar {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav.tabbar .tabbar-inner {
      max-width: 1180px;
      margin: auto;
      display: flex;
      gap: 4px;
      padding: 0 20px;
    }

    .tab {
      background: transparent;
      border: none;
      color: rgba(0, 0, 0, 0.55);
      padding: 16px 16px 14px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      font-family: var(--font-body);
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .tab:hover {
      color: var(--black);
    }

    .tab.active {
      color: var(--black);
      border-bottom-color: var(--red);
    }

    .tab .count {
      display: inline-block;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 20px;
      padding: 1px 8px;
      font-size: 11px;
      margin-left: 5px;
      font-weight: 600;
    }

    .tab.active .count {
      background: var(--red);
      color: var(--white);
    }

    /* ---------- grid / cards ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 22px;
      padding: 40px 20px 60px;
      max-width: 1180px;
      margin: auto;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
    }

    .card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
      border-color: var(--pink);
    }

    .badge {
      display: inline-block;
      background: var(--black);
      color: var(--white);
      padding: 5px 11px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .levels-badge {
      float: right;
      background: rgba(255, 149, 182, 0.2);
      color: var(--red);
      padding: 5px 11px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 700;
    }

    .card h3 {
      margin-top: 16px;
      margin-bottom: 8px;
      font-size: 18px;
      color: var(--black);
      clear: both;
    }

    .task {
      color: rgba(0, 0, 0, 0.6);
      line-height: 1.55;
      min-height: 45px;
      font-size: 14px;
    }

    .formula {
      margin-top: 16px;
      background: var(--black);
      border-radius: 8px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--pink);
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    button.dl {
      margin-top: 16px;
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 11px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13.5px;
      font-family: var(--font-body);
      width: 100%;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }

    button.dl:hover {
      background: var(--red);
      transform: translateY(-1px);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: rgba(0, 0, 0, 0.5);
      padding: 40px 0;
    }

    footer.site-foot {
      background: var(--black);
      color: rgba(255, 255, 255, 0.65);
      padding: 30px 20px;
      text-align: center;
      font-size: 13.5px;
      font-family: var(--font-mono);
    }

    @media (max-width: 640px) {
      .practice-hero h1 { font-size: 1.7rem; }
      .formula-bar { max-width: 100%; }
    }
  </style>
</head>

<body>
  <div class="practice-hero">

    <h1>Excel Function Training</h1>
    <p class="subtitle">50 Modules &bull; 8 Functions &bull; 3 Difficulty Levels per Module &bull; Excel Download</p>

  <div class="grid" id="grid"></div>

  <footer class="site-foot">SSZ Training &amp; Consultancy</footer>

  <script>
    const EXERCISE_API =
        "https://script.google.com/macros/s/AKfycbwuOLk8uuO2zqHKUytytkAsed5CbBfyQB3J8eoflgO2KA2v3o7k3mc-9hIYmjr2mjm3ig/exec";

    const token =
        sessionStorage.getItem("ssz_excel_token");

    // No token = no access
    if (!token) {

        window.location.replace("../");

    } else {

        const callbackName =
            "sszVerifyCallback_" + Date.now();

        window[callbackName] = function(response) {

            delete window[callbackName];

            if (!response.success) {

                sessionStorage.removeItem(
                    "ssz_excel_token"
                );

                window.location.replace("../");
            }
        };

        const script =
            document.createElement("script");

        script.src =
            EXERCISE_API +
            "?token=" +
            encodeURIComponent(token) +
            "&callback=" +
            encodeURIComponent(callbackName);

        script.onerror = function() {

            sessionStorage.removeItem(
                "ssz_excel_token"
            );

            window.location.replace("../");
        };

        document.body.appendChild(script);
    }

    /* =========================================

    ========================================= */
    const LEVELS = ["Beginner", "Intermediate", "Advanced"];

    /* =========================================
       TOPICS DATABASE — 50 modules across
       SUMIF, SUMIFS, COUNTIF, COUNTIFS, VLOOKUP,
       XLOOKUP, INDEX-MATCH and PivotTable.
    ========================================= */
    const TOPICS = [{"id": 1, "group": "SUMIF", "title": "SUMIF: Product Sales", "intro": "Calculate the total Sales based on a single category criterion, in the context of product sales.", "levels": {"Beginner": {"task": "Calculate the total Sales for Product \"Laptop\".", "headers": ["Product", "Sales"], "rows": [["Mouse", 4664], ["Monitor", 2331], ["Webcam", 4119], ["Webcam", 3765], ["Monitor", 1800], ["Printer", 1893], ["Laptop", 4635], ["Keyboard", 1292], ["Webcam", 2575], ["Keyboard", 2781], ["Keyboard", 2570], ["Mouse", 2053]], "formula": "=SUMIF(A2:A13,\"Laptop\",B2:B13)", "result": "RM4,635"}, "Intermediate": {"task": "Calculate the total Sales for Product \"Mouse\" (larger dataset).", "headers": ["Product", "Sales"], "rows": [["Laptop", 2566], ["Webcam", 1148], ["Mouse", 3084], ["Laptop", 4504], ["Webcam", 2269], ["Webcam", 1032], ["Monitor", 3178], ["Monitor", 4666], ["Mouse", 2479], ["Webcam", 1891], ["Keyboard", 4072], ["Keyboard", 1726], ["Monitor", 4460], ["Mouse", 4889], ["Keyboard", 1897]], "formula": "=SUMIF(A2:A16,\"Mouse\",B2:B16)", "result": "RM10,452"}, "Advanced": {"task": "Use a wildcard (*) to calculate the total Sales for Product starting with the letter 'L'.", "headers": ["Product", "Sales"], "rows": [["Printer", 3819], ["Keyboard", 912], ["Monitor", 3738], ["Printer", 4368], ["Printer", 2257], ["Mouse", 1899], ["Monitor", 3617], ["Keyboard", 2035], ["Webcam", 2918], ["Laptop", 1291], ["Webcam", 1437], ["Keyboard", 3276], ["Webcam", 1486], ["Printer", 3149], ["Printer", 3770]], "formula": "=SUMIF(A2:A16,\"L*\",B2:B16)", "result": "RM1,291"}}}, {"id": 2, "group": "SUMIF", "title": "SUMIF: Department Expenses", "intro": "Calculate the total Expense based on a single category criterion, in the context of department expenses.", "levels": {"Beginner": {"task": "Calculate the total Expense for Department \"Marketing\".", "headers": ["Department", "Expense"], "rows": [["Operations", 698], ["Operations", 1034], ["IT", 399], ["Legal", 1331], ["HR", 1532], ["HR", 890], ["IT", 1718], ["HR", 973], ["IT", 444], ["Finance", 695], ["HR", 481], ["IT", 1876]], "formula": "=SUMIF(A2:A13,\"Marketing\",B2:B13)", "result": "RM0"}, "Intermediate": {"task": "Calculate the total Expense for Department \"HR\" (larger dataset).", "headers": ["Department", "Expense"], "rows": [["Marketing", 1762], ["Finance", 1160], ["Marketing", 1897], ["Finance", 968], ["Legal", 1721], ["Legal", 1262], ["Operations", 1843], ["Finance", 1223], ["IT", 1445], ["Operations", 1271], ["HR", 1460], ["IT", 427], ["Operations", 770], ["HR", 1723], ["HR", 328]], "formula": "=SUMIF(A2:A16,\"HR\",B2:B16)", "result": "RM3,511"}, "Advanced": {"task": "Use a wildcard (*) to calculate the total Expense for Department starting with the letter 'M'.", "headers": ["Department", "Expense"], "rows": [["IT", 1582], ["IT", 1409], ["IT", 1634], ["HR", 1668], ["Operations", 821], ["Marketing", 798], ["Operations", 568], ["Marketing", 1964], ["IT", 1432], ["Legal", 1594], ["Finance", 370], ["Legal", 1663], ["Legal", 658], ["Finance", 1974], ["Operations", 1963]], "formula": "=SUMIF(A2:A16,\"M*\",B2:B16)", "result": "RM2,762"}}}, {"id": 3, "group": "SUMIF", "title": "SUMIF: Regional Sales", "intro": "Calculate the total Sales based on a single category criterion, in the context of regional sales.", "levels": {"Beginner": {"task": "Calculate the total Sales for Region \"Selangor\".", "headers": ["Region", "Sales"], "rows": [["Selangor", 4270], ["Sabah", 2967], ["Selangor", 3770], ["Sarawak", 4207], ["Sabah", 2247], ["Johor", 2699], ["Sabah", 3257], ["Sabah", 3881], ["KL", 4466], ["Sabah", 3724], ["Sabah", 3628], ["Selangor", 3044]], "formula": "=SUMIF(A2:A13,\"Selangor\",B2:B13)", "result": "RM11,084"}, "Intermediate": {"task": "Calculate the total Sales for Region \"Penang\" (larger dataset).", "headers": ["Region", "Sales"], "rows": [["Johor", 4141], ["Johor", 3177], ["Selangor", 2302], ["Sarawak", 3130], ["KL", 3252], ["Johor", 3348], ["KL", 3661], ["Penang", 2325],     /* =========================================
       RENDER
    ========================================= */
    const grid = document.getElementById("grid");
    let activeGroup = "ALL";

    function renderGrid() {
      grid.innerHTML = "";
      const list = activeGroup === "ALL" ? TOPICS : TOPICS.filter((t) => t.group === activeGroup);

      if (list.length === 0) {
        grid.innerHTML = '<div class="empty-state">No modules in this category.</div>';
        return;
      }

      list.forEach((topic) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div>
            <span class="badge">${topic.group}</span>
            <span class="levels-badge">3 Levels</span>
          </div>

          <h3>${topic.title}</h3>

          <div class="task">${topic.intro}</div>

          <div class="formula">${topic.levels.Beginner.formula}</div>

          <button class="dl" onclick="downloadTopic(${topic.id})">Download Excel (3 Levels)</button>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById("tabbar").addEventListener("click", (e) => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      btn.classList.add("active");
      activeGroup = btn.dataset.group;
      renderGrid();
    });

    /* =========================================
       EXCEL STYLING — recolored to the black /
       white / red / pink / blue palette.
       Sum-related highlights use pink/red instead
       of the original green/brass scheme.
    ========================================= */

    const EXCEL_COLORS = {
      headerBg: "FFD6E4",     // pale pink header fill
      headerText: "B20000",   // red
      taskBg: "FFF0F5",       // very pale pink
      answerBg: "FFE3EC",     // pink answer highlight
      answerText: "8A0000",   // dark red
      tableBg: "FFF7FA",      // near-white pink tint
      border: "D0D0D0",
      text: "1A1A1A"
    };

    const thinBorder = {
      top: { style: "thin", color: { rgb: EXCEL_COLORS.border } },
      bottom: { style: "thin", color: { rgb: EXCEL_COLORS.border } },
      left: { style: "thin", color: { rgb: EXCEL_COLORS.border } },
      right: { style: "thin", color: { rgb: EXCEL_COLORS.border } }
    };

    const answerBorder = {
      top: { style: "medium", color: { rgb: EXCEL_COLORS.answerText } },
      bottom: { style: "medium", color: { rgb: EXCEL_COLORS.answerText } },
      left: { style: "medium", color: { rgb: EXCEL_COLORS.answerText } },
      right: { style: "medium", color: { rgb: EXCEL_COLORS.answerText } }
    };

    function styleCell(ws, address, style) {
      if (!ws[address]) return;
      ws[address].s = style;
    }

    function styleRange(ws, startRow, endRow, startCol, endCol, style) {
      for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
          const address = XLSX.utils.encode_cell({ r: r, c: c });
          if (!ws[address]) continue;
          ws[address].s = style;
        }
      }
    }

    function buildPracticeSheet(level) {
      const practice = [
        ["TASK", level.task],
        [],
        level.headers,
        ...level.rows
      ];

      const ws = XLSX.utils.aoa_to_sheet(practice);

      ws["!cols"] = level.headers.map((header, index) => ({
        wch: index === 0 ? 22 : 18
      }));

      styleCell(ws, "A1", {
        font: { name: "Calibri", sz: 12, bold: true, color: { rgb: EXCEL_COLORS.headerText } },
        fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.headerBg } },
        alignment: { vertical: "center", horizontal: "left", wrapText: true },
        border: thinBorder
      });

      styleCell(ws, "B1", {
        font: { name: "Calibri", sz: 11, bold: true, color: { rgb: EXCEL_COLORS.text } },
        fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.taskBg } },
        alignment: { vertical: "center", horizontal: "left", wrapText: true },
        border: thinBorder
      });

      level.headers.forEach((header, col) => {
        const address = XLSX.utils.encode_cell({ r: 2, c: col });
        styleCell(ws, address, {
          font: { name: "Calibri", sz: 11, bold: true, color: { rgb: EXCEL_COLORS.headerText } },
          fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.headerBg } },
          alignment: { vertical: "center", horizontal: "center", wrapText: true },
          border: thinBorder
        });
      });

      level.rows.forEach((row, rowIndex) => {
        row.forEach((value, colIndex) => {
          const address = XLSX.utils.encode_cell({ r: rowIndex + 3, c: colIndex });
          styleCell(ws, address, {
            font: { name: "Calibri", sz: 10, color: { rgb: EXCEL_COLORS.text } },
            alignment: { vertical: "center", horizontal: "left", wrapText: true },
            border: thinBorder
          });
        });
      });

      ws["!freeze"] = { xSplit: 0, ySplit: 3 };

      return ws;
    }

    function buildAnswerSheet(topic, levelName, level) {
      const answer = [
        ["MODULE", topic.title],
        ["LEVEL", levelName],
        [],
        ["FORMULA / STEPS", level.formula],
        [],
        ["ANSWER", level.result]
      ];

      if (level.resultTable) {
        answer.push([]);
        answer.push(["FULL ANSWER TABLE"]);
        level.resultTable.forEach(row => {
          answer.push(row);
        });
      }

      const ws = XLSX.utils.aoa_to_sheet(answer);

      ws["!cols"] = [
        { wch: 27 }, { wch: 65 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 20 }
      ];

      styleCell(ws, "A1", {
        font: { name: "Calibri", sz: 12, bold: true, color: { rgb: EXCEL_COLORS.headerText } },
        fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.headerBg } },
        alignment: { vertical: "center" },
        border: thinBorder
      });

      styleCell(ws, "B1", {
        font: { name: "Calibri", sz: 14, bold: true, color: { rgb: EXCEL_COLORS.headerText } },
        fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.taskBg } },
        alignment: { vertical: "center", wrapText: true },
        border: thinBorder
      });

      styleCell(ws, "A2", {
        font: { name: "Calibri", sz: 11, bold: true },
        fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.tableBg } },
        alignment: { vertical: "center" },
        border: thinBorder
      });

      styleCell(ws, "B2", {
        font: { name: "Calibri", sz: 11, bold: true },
        fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
        alignment: { vertical: "center" },
        border: thinBorder
      });

      styleCell(ws, "A4", {
        font: { name: "Calibri", sz: 11, bold: true },
        fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.tableBg } },
        alignment: { vertical: "center", wrapText: true },
        border: thinBorder
      });

      styleCell(ws, "B4", {
        font: { name: "Consolas", sz: 11, bold: true },
        fill: { patternType: "solid", fgColor: { rgb: "FFFFFF" } },
        alignment: { vertical: "center", wrapText: true },
        border: thinBorder
      });

      styleCell(ws, "A6", {
        font: { name: "Calibri", sz: 12, bold: true },
        fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.answerBg } },
        alignment: { horizontal: "center", vertical: "center" },
        border: answerBorder
      });

      styleCell(ws, "B6", {
        font: { name: "Calibri", sz: 14, bold: true, color: { rgb: EXCEL_COLORS.answerText } },
        fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.answerBg } },
        alignment: { horizontal: "left", vertical: "center", wrapText: true },
        border: answerBorder
      });

      if (level.resultTable) {
        const tableTitleRow = 8;

        styleCell(ws, "A8", {
          font: { name: "Calibri", sz: 12, bold: true, color: { rgb: EXCEL_COLORS.headerText } },
          fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.headerBg } },
          alignment: { vertical: "center" },
          border: thinBorder
        });

        const headers = level.resultTable[0];

        headers.forEach((header, colIndex) => {
          const address = XLSX.utils.encode_cell({ r: tableTitleRow, c: colIndex });
          styleCell(ws, address, {
            font: { name: "Calibri", sz: 11, bold: true, color: { rgb: EXCEL_COLORS.headerText } },
            fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.headerBg } },
            alignment: { horizontal: "center", vertical: "center", wrapText: true },
            border: thinBorder
          });
        });

        level.resultTable.slice(1).forEach((row, rowIndex) => {
          row.forEach((value, colIndex) => {
            const address = XLSX.utils.encode_cell({ r: tableTitleRow + 1 + rowIndex, c: colIndex });
            styleCell(ws, address, {
              font: { name: "Calibri", sz: 10, bold: true, color: { rgb: EXCEL_COLORS.text } },
              fill: { patternType: "solid", fgColor: { rgb: EXCEL_COLORS.tableBg } },
              alignment: { vertical: "center", horizontal: "left", wrapText: true },
              border: thinBorder
            });
          });
        });
      }

      ws["!rows"] = {
        0: { hpt: 25 }, 1: { hpt: 22 }, 3: { hpt: 35 }, 5: { hpt: 32 }, 7: { hpt: 25 }
      };

      return ws;
    }

    function downloadTopic(id) {
      try {
        const topic = TOPICS.find(t => t.id === id);

        if (!topic) {
          alert("Module not found.");
          return;
        }

        if (typeof XLSX === "undefined" || !XLSX.utils || !XLSX.writeFile) {
          alert("The Excel library failed to load. Please refresh the page and try again.");
          return;
        }

        const wb = XLSX.utils.book_new();

        LEVELS.forEach(levelName => {
          const level = topic.levels[levelName];
          if (!level) return;

          const practiceSheet = buildPracticeSheet(level);
          const answerSheet = buildAnswerSheet(topic, levelName, level);

          XLSX.utils.book_append_sheet(wb, practiceSheet, `${levelName} Practice`);
          XLSX.utils.book_append_sheet(wb, answerSheet, `${levelName} Answer`);
        });

        const safeTitle = topic.title
          .replace(/[^A-Za-z0-9]+/g, "_")
          .replace(/^_+|_+$/g, "")
          .slice(0, 40);

        const fileName = `${safeTitle}_Module_${topic.id}.xlsx`;

        XLSX.writeFile(wb, fileName);

      } catch (error) {
        console.error("Excel generation error:", error);
        alert("Failed to generate Excel.\\n\\nError: " + error.message);
      }
    }

    // cycling formula bar - showcases real formulas from every module group
    const FORMULAS = TOPICS
      .filter(t => t.group !== "PIVOT")
      .map(t => t.levels.Beginner.formula.split('|')[0].trim());
    let fi = 0;
    function cycleFx() {
      const el = document.getElementById('fxCycle');
      el.textContent = FORMULAS[fi];
      fi = (fi + 1) % FORMULAS.length;
    }
    cycleFx();
    setInterval(cycleFx, 2600);

    renderGrid();
