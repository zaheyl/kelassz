<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSZ Training — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --pink:#ff95b6;
    --red:#b20000;
    --white:#ffffff;
    --bg-top:#ffffff;
    --bg-bottom:#f7d3de;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    height:100%;
  }

  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background: linear-gradient(180deg, #ffffff 0%, #fdfdfd 40%, #bababa 100%);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }

  /* faint grid, like ruled notebook paper — nods to "class in session" */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(rgba(0,0,0,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.028) 1px, transparent 1px);
    background-size: 42px 42px;
    pointer-events:none;
    z-index:0;
  }

  .nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: var(--container-max);
    margin: 0 auto;
    padding: 0 40px;
    height: var(--nav-height);
}

  .nav-logo {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.01em;
    color: var(--color-ink);
    text-decoration: none;
    display: flex;
    align-items: baseline;
    gap: 6px;
}

.nav-logo {
    display: flex;
    align-items: center;
    gap: 8px;
}

.nav-icon {
    width: 35px;
    height: 35px;
    object-fit: contain;
}

.nav-logo span {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #b20000;
}

  .wrap{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:560px;
    width:100%;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:15px;
    letter-spacing:-0.01em;
    margin-bottom:56px;
  }

  .brand-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--pink);
  }

  .pass{
    position:relative;
    width:100%;
    background:var(--white);
    border:1.5px solid var(--ink);
    border-radius:18px;
    padding:40px 36px 32px;
    box-shadow: 0 18px 46px rgba(0,0,0,0.09);
  }

  .pass::before, .pass::after{
    content:"";
    position:absolute;
    top:50%;
    width:26px;
    height:26px;
    background: var(--bg-bottom);
    border:1.5px solid var(--ink);
    border-radius:50%;
    transform:translateY(-50%);
  }
  .pass::before{ left:-14px; }
  .pass::after{ right:-14px; }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--red);
    margin-bottom:22px;
  }

  .eyebrow::before, .eyebrow::after{
    content:"";
    width:18px;
    height:1.5px;
    background:var(--pink);
  }

  h1{
    font-weight:700;
    font-size:clamp(28px, 5.5vw, 40px);
    line-height:1.15;
    letter-spacing:-0.02em;
    margin:0 0 16px;
  }

  h1 em{
    font-style:normal;
    color:var(--red);
  }

  p.lede{
    font-size:15.5px;
    line-height:1.65;
    color:#3a3a3a;
    max-width:400px;
    margin:0 auto 30px;
  }

  /* dashed divider like a tear line on the ticket */
  .tear{
    border:none;
    border-top:1.5px dashed rgba(0,0,0,0.18);
    margin:0 0 28px;
  }

  .countdown{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:30px;
  }

  .unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:64px;
    padding:12px 6px;
    background:#fafafa;
    border:1px solid #e8e3e3;
    border-radius:10px;
  }

  .unit strong{
    font-size:24px;
    font-weight:700;
    line-height:1;
  }

  .unit span{
    font-size:9.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#888;
    margin-top:6px;
  }

  form{
    display:flex;
    gap:8px;
    max-width:400px;
    margin:0 auto;
  }

  input[type="email"]{
    flex:1;
    padding:13px 14px;
    border:1.5px solid var(--ink);
    border-radius:9px;
    font-family:'Inter', sans-serif;
    font-size:14px;
    outline:none;
    min-width:0;
  }

  input[type="email"]:focus{
    border-color:var(--red);
  }

  button{
    padding:13px 20px;
    border:1.5px solid var(--ink);
    background:var(--ink);
    color:var(--white);
    border-radius:9px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    white-space:nowrap;
    transition:background-color 0.2s ease, color 0.2s ease;
  }

  button:hover{
    background:var(--red);
    border-color:var(--red);
  }

  button:focus-visible, input:focus-visible{
    outline:2px solid var(--red);
    outline-offset:2px;
  }

  .note{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:#999;
    margin-top:14px;
  }

  .status{
    display:none;
    font-size:13.5px;
    color:var(--red);
    font-weight:500;
    margin-top:14px;
  }

  .status.show{ display:block; }

  footer{
    margin-top:32px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:#a3a3a3;
  }

  @media (max-width:480px){
    .pass{ padding:32px 22px 26px; }
    .unit{ min-width:0; flex:1; padding:10px 4px; }
    form{ flex-direction:column; }
    button{ width:100%; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="brand">
                <nav class="nav-container">
            <a href="#home" class="nav-logo">
                <img src="photo/ssz-icon.png" alt="SSZ Training Logo" class="nav-icon">
                SSZ <span>Training</span>
            </a>
        </nav>
    </div>

    <div class="pass">
      <span class="eyebrow">LET'S TEST YOUR SKILLS</span>

      <h1>If you're here not for learning. Then, you better <em>be prepared</em>!</h1>
      <p class="lede">Our trainers are cooking something. Stay tuned for the meals... if you're hungry.</p>

      <hr class="tear">

      <div class="countdown" id="countdown">
        <div class="unit"><strong id="cd-days">--</strong><span>Days</span></div>
        <div class="unit"><strong id="cd-hours">--</strong><span>Hours</span></div>
        <div class="unit"><strong id="cd-mins">--</strong><span>Mins</span></div>
        <div class="unit"><strong id="cd-secs">--</strong><span>Secs</span></div>
      </div>

    </div>

    <footer>© 2026 SSZ Training. All rights reserved.</footer>
  </div>

<script>
  // ---- Set your real launch date/time here ----
  const LAUNCH_DATE = new Date("2026-10-01T00:00:00+08:00");

  function updateCountdown(){
    const now = new Date();
    const diff = LAUNCH_DATE - now;

    const els = {
      d: document.getElementById('cd-days'),
      h: document.getElementById('cd-hours'),
      m: document.getElementById('cd-mins'),
      s: document.getElementById('cd-secs')
    };

    if(diff <= 0){
      els.d.textContent = "00";
      els.h.textContent = "00";
      els.m.textContent = "00";
      els.s.textContent = "00";
      return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const mins = Math.floor((diff / (1000*60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    els.d.textContent = String(days).padStart(2,'0');
    els.h.textContent = String(hours).padStart(2,'0');
    els.m.textContent = String(mins).padStart(2,'0');
    els.s.textContent = String(secs).padStart(2,'0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ---- Notify form (front-end only placeholder) ----
  document.getElementById('notifyForm').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('emailInput').value.trim();
    const statusMsg = document.getElementById('statusMsg');

    if(!email){ return; }

    // TODO: replace with your actual submission endpoint (e.g. same
    // Apps Script pattern used elsewhere on the site) to store emails.
    statusMsg.textContent = "You're on the list — see you soon!";
    statusMsg.classList.add('show');
    this.reset();
  });
</script>

</body>
</html>
